# Runs once and exits. The server's cron starts it:
#   every hour:   docker compose run --rm tradebot run
#   every morning: docker compose run --rm tradebot report
name: tradebot
services:
  tradebot:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
