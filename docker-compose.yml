# Runs once and exits. The server's cron starts it:
#   every hour:    docker compose run --rm tradebot run      (gold, .env)
#                  docker compose run --rm crypto run        (crypto, .env.crypto)
#   every morning: docker compose run --rm tradebot report / crypto report
name: tradebot
services:
  tradebot:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
  crypto:
    build: .
    env_file: .env.crypto
    environment:
      DATA_DIR: /app/data/crypto
    volumes:
      - ./data:/app/data
